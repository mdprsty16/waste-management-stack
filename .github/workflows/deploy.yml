name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  # ═══════════════════════════════════════
  # BUILD & PUSH — Website (Next.js)
  # ═══════════════════════════════════════
  build-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Website
        uses: docker/build-push-action@v5
        with:
          context: ./apps/website
          file: ./apps/website/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/waste-management-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════
  # BUILD & PUSH — ML Serving (FastAPI)
  # ═══════════════════════════════════════
  build-ml-serving:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ML Serving
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ml-serving
          file: ./apps/ml-serving/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/waste-management-ml-serving:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════
  # DEPLOY — SSH ke VPS
  # ═══════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: [build-website, build-ml-serving]
    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/waste-management

            # Login ke GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tarik image terbaru semua service
            docker compose pull website
            docker compose pull ml-serving

            # Restart semua service (zero-downtime untuk traefik)
            docker compose up -d website ml-serving

            # Hapus image lama
            docker image prune -f
